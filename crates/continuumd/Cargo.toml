[package]
name = "continuumd"
version = "0.1.0"
edition = "2021"
authors = ["Joshua Sultan"]
license = "AGPL-3.0-only OR LicenseRef-Continuum-Commercial"

[dependencies]
continuum-core = { path = "../continuum-core" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mdns-sd = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3.3"
log = "0.4"
env_logger = "0.11"
hex = "0.4"
