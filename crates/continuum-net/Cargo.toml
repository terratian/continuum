[package]
name = "continuum-net"
version = "0.1.0"
edition = "2021"
authors = ["Joshua Sultan"]
license = "AGPL-3.0-only OR LicenseRef-Continuum-Commercial"

[dependencies]
continuum-core = { path = "../continuum-core" }
tokio = { version = "1.38", features = ["full"] }
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
